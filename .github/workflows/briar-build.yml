name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".docker/**"
      - ".docker/.dockerignore"
      - ".github/workflows/briar-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Pinned to arcesus: giratus's network link tops out near 9 Mbps, which stalls image builds and pushes
    runs-on: [self-hosted, furnace, arcesus]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker # reuses the machine's image layers between builds

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.commit_sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
